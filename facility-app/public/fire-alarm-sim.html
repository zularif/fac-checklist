<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FACP Cause &amp; Effect Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Input → Process → Output poster drawn from a shared config; controls, log and an in-page editor below */
:root{
  --bg:#e9edf1; --fg:#1b1f24; --muted:#5b6570; --surface:#fff; --surface-2:#f4f6f8; --line:#d3d9e0; --accent:#1f5fa8;
  --fire:#d32f2f; --fire-soft:#fde3e1; --warn:#b86e00; --warn-soft:#fff0d6; --ok:#2e7d32; --ok-soft:#e3f2e5;
  --f-body:"Barlow",Arial,sans-serif; --f-head:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e8eaed;--muted:#9aa3ae;--surface:#1b1f24;--surface-2:#22272d;--line:#323941;--accent:#6ea2e8;--fire-soft:#3a1c1c;--warn-soft:#3a2c14;--ok-soft:#1c3121;--warn:#f0a43a;--fire:#ff5a52;--ok:#66bb6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--fg:#e8eaed;--muted:#9aa3ae;--surface:#1b1f24;--surface-2:#22272d;--line:#323941;--accent:#6ea2e8;--fire-soft:#3a1c1c;--warn-soft:#3a2c14;--ok-soft:#1c3121;--warn:#f0a43a;--fire:#ff5a52;--ok:#66bb6a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body)}
.wrap{max-width:1500px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.topbar .info{font-size:13px;color:var(--muted)}
.scroller{overflow-x:auto;border-radius:12px}

/* ---- poster canvas: always light, like the printed diagram ---- */
.canvas{position:relative;min-width:900px;background:#fff;border-radius:12px;container-type:inline-size;color:#111;color-scheme:light;--u:calc(100cqw/1752)}
.abs{position:absolute}
.U{left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u))}
.box{border:calc(2*var(--u)) solid #b9c7d8;border-radius:calc(14*var(--u));background:#fff}
.box.out{border-color:#b6d7c1;background:#fbfefc}
.hdr{border-radius:calc(14*var(--u)) calc(14*var(--u)) calc(4*var(--u)) calc(4*var(--u));color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.05}
.hdr b{font-weight:700;font-size:calc(34*var(--u));letter-spacing:.02em}
.hdr span{font-weight:600;font-size:calc(22*var(--u))}
.hdr.in{background:#0b4a8f} .hdr.proc{background:#c4161c} .hdr.out{background:#13693a}
.card{border-radius:calc(10*var(--u));display:flex;align-items:center;transition:background .25s,box-shadow .25s;z-index:2}
.card.in{background:#e8eff8} .card.out{background:#e9f5ec}
.ph{flex:none;display:grid;place-items:center;height:100%;width:calc(170*var(--u));cursor:pointer}
.ph img{height:calc(74*var(--u));width:calc(150*var(--u));object-fit:contain;display:block;mix-blend-mode:multiply}
.ph .noimg{font-family:var(--f-mono);font-size:calc(12*var(--u));color:#8a96a3;border:calc(1.5*var(--u)) dashed #b6c0cb;border-radius:calc(6*var(--u));padding:calc(18*var(--u)) calc(14*var(--u))}
.txt{min-width:0;flex:1;padding-right:calc(12*var(--u))}
.txt .t{font-weight:700;font-size:calc(21*var(--u));line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt .s{font-weight:500;font-size:calc(16.5*var(--u));color:#333;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.btns{display:flex;flex-wrap:wrap;gap:calc(6*var(--u));margin-top:calc(6*var(--u))}
.tg{font-family:var(--f-mono);font-weight:700;font-size:calc(13.5*var(--u));padding:calc(3*var(--u)) calc(10*var(--u));border-radius:calc(20*var(--u));border:calc(1.5*var(--u)) solid #8fa3ba;background:#fff;color:#2a3a4d;cursor:pointer;display:flex;align-items:center;gap:calc(6*var(--u))}
.tg i{width:calc(9*var(--u));height:calc(9*var(--u));border-radius:50%;background:#b8c3cf}
.tg[aria-pressed="true"]{background:#d32f2f;border-color:#d32f2f;color:#fff}
.tg[aria-pressed="true"] i{background:#fff;animation:blink .5s steps(1) infinite}
.tg:focus-visible,.ph:focus-visible,.key:focus-visible,.ed button:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.st{font-family:var(--f-head);font-weight:700;font-size:calc(15*var(--u));letter-spacing:.06em;text-transform:uppercase;margin-top:calc(5*var(--u));color:#6b7a73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;right:calc(-9*var(--u));top:50%;margin-top:calc(-9*var(--u));border-radius:50%;border:calc(3*var(--u)) solid #c4161c;background:#fff;width:calc(18*var(--u));height:calc(18*var(--u))}
@keyframes blink{50%{opacity:.2}}
@keyframes devFire{0%,49%{filter:drop-shadow(0 0 calc(10*var(--u)) #ff1a1a) brightness(1.08)}50%,100%{filter:brightness(.55) saturate(.6)}}
@keyframes devGo{0%,49%{filter:drop-shadow(0 0 calc(12*var(--u)) #20c05a) brightness(1.12)}50%,100%{filter:brightness(.6)}}
@keyframes devAmb{0%,49%{filter:drop-shadow(0 0 calc(12*var(--u)) #ffae00) brightness(1.1)}50%,100%{filter:brightness(.6)}}
@keyframes cFire{0%,49%{background:#ffd9d6;box-shadow:0 0 0 calc(3*var(--u)) #e53935 inset}50%,100%{background:#fff1f0;box-shadow:0 0 0 calc(3*var(--u)) #f3a19c inset}}
@keyframes cGo{0%,49%{background:#c9f0d4;box-shadow:0 0 0 calc(3*var(--u)) #1e8e4a inset}50%,100%{background:#eefaf1;box-shadow:0 0 0 calc(3*var(--u)) #9fd8b2 inset}}
@keyframes cAmb{0%,49%{background:#ffe9bd;box-shadow:0 0 0 calc(3*var(--u)) #e09400 inset}50%,100%{background:#fff7e6;box-shadow:0 0 0 calc(3*var(--u)) #f3cf85 inset}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.card.in.fire,.card.in.pre{animation:cFire .8s steps(1) infinite} .card.in.fire .ph img,.card.in.pre .ph img{animation:devFire .8s steps(1) infinite}
.card.in.sup{animation:cAmb 1.2s steps(1) infinite} .card.in.sup .ph img{animation:devAmb 1.2s steps(1) infinite}
.card.in.fire .dot,.card.in.pre .dot{background:#c4161c} .card.in.sup .dot{background:#e09400;border-color:#e09400}
.card.out.fire{animation:cGo .8s steps(1) infinite} .card.out.fire .ph img{animation:devGo .8s steps(1) infinite}
.card.out.pre,.card.out.sup{animation:cAmb 1.2s steps(1) infinite} .card.out.pre .ph img,.card.out.sup .ph img{animation:devAmb 1.2s steps(1) infinite}
.card.out.fire .st{color:#13693a} .card.out.pre .st,.card.out.sup .st{color:#9a5d00}
.card.out.fire.shake:not(.sil) .ph img{animation:devGo .8s steps(1) infinite, shake .16s linear infinite}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.w{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.w.r{stroke:#d71920} .w.b{stroke:#1565c0}
.w.live{stroke-dasharray:14 10;animation:flow .6s linear infinite;stroke-width:6}
.w.r.live{filter:drop-shadow(0 0 3px #ff3b30)} .w.b.live{stroke:#0d8f45;filter:drop-shadow(0 0 3px #22c55e)}
.w.r.live.amb{stroke:#e09400;filter:drop-shadow(0 0 3px #ffae00)}
@keyframes flow{to{stroke-dashoffset:-24}}

/* process screen */
.scr{z-index:2;background:#16191d;border-radius:calc(14*var(--u));padding:calc(10*var(--u));display:flex;flex-direction:column;gap:calc(8*var(--u));box-shadow:0 0 0 calc(3*var(--u)) #2b3036 inset}
.scr-top{display:flex;justify-content:space-between;color:#aeb6bf;font-family:var(--f-mono);font-weight:700;font-size:calc(15*var(--u));letter-spacing:.06em;padding:0 calc(4*var(--u))}
.scr-main{flex:1;min-height:0;background:#0a2618;border-radius:calc(8*var(--u));padding:calc(14*var(--u)) calc(16*var(--u));color:#a6f7c4;font-family:var(--f-mono);display:flex;flex-direction:column;gap:calc(6*var(--u));box-shadow:inset 0 0 calc(24*var(--u)) rgba(0,0,0,.6);overflow:hidden}
.scr-h{font-weight:700;font-size:calc(38*var(--u));line-height:1.05;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-c{font-size:calc(17*var(--u));opacity:.85}
.scr-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(4*var(--u));margin-top:calc(4*var(--u));border-top:calc(1.5*var(--u)) dashed currentColor;padding-top:calc(8*var(--u))}
.scr-list div{font-size:calc(17*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-list .dim{opacity:.6} .scr-list .w2{color:#7cc4ff} .scr-list .w3{color:#ffd27a}
.scr-o{font-weight:700;font-size:calc(18*var(--u));border-top:calc(1.5*var(--u)) dashed currentColor;padding-top:calc(8*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-leds{display:flex;justify-content:space-between;padding:0 calc(6*var(--u))}
.sl{display:flex;align-items:center;gap:calc(5*var(--u));color:#aeb6bf;font-family:var(--f-head);font-weight:700;font-size:calc(13*var(--u));letter-spacing:.06em;text-transform:uppercase}
.sl i{width:calc(14*var(--u));height:calc(14*var(--u));border-radius:50%;background:#3a3f46}
.sl.pw i{background:#3ddc6a;box-shadow:0 0 calc(8*var(--u)) #3ddc6a}
.sl.pre.on i,.sl.su.on i{background:#ffb020;box-shadow:0 0 calc(8*var(--u)) #ffb020}
.sl.su.on i{animation:blink 1.2s steps(1) infinite}
.sl.fi.on i{background:#ff2a2a;box-shadow:0 0 calc(10*var(--u)) #ff2a2a;animation:blink .8s steps(1) infinite}
.sl.si.on i{background:#ffd54a;box-shadow:0 0 calc(8*var(--u)) #ffd54a}
.scr.s1,.scr.s2{box-shadow:0 0 0 calc(4*var(--u)) #e09400 inset,0 0 calc(24*var(--u)) #ffae00}
.scr.s1 .scr-main,.scr.s2 .scr-main{background:#2a1f05;color:#ffd27a}
.scr.s1 .scr-h{animation:blink 1.2s steps(1) infinite}
.scr.s3{animation:scrFire .8s steps(1) infinite} .scr.s3 .scr-main{background:#2b0a0a;color:#ffb3ad} .scr.s3 .scr-h{color:#ff6b62;animation:blink 1s steps(1) infinite}
.scr.ack .scr-h,.scr.ack .sl i{animation:none!important}
@keyframes scrFire{0%,49%{box-shadow:0 0 0 calc(4*var(--u)) #ff2a2a inset,0 0 calc(30*var(--u)) #ff2a2a}50%,100%{box-shadow:0 0 0 calc(4*var(--u)) #7a1515 inset,0 0 calc(8*var(--u)) #ff2a2a}}
.cap{z-index:2;background:#ececec;border-radius:calc(12*var(--u));text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.cap b{font-size:calc(22*var(--u))} .cap span{font-size:calc(18*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 calc(10*var(--u))}
.cap.s1,.cap.s2{background:#ffe2a8} .cap.s3{background:#ffcdc9}

/* ---- controls ---- */
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:860px){.bar{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stage{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:4px 12px;border-radius:999px;font-size:16px;color:#fff;background:var(--ok)}
.stage.s1 .pill,.stage.s2 .pill{background:var(--warn)} .stage.s3 .pill{background:var(--fire)}
.stage p{margin:0;flex:1 1 260px;font-size:14.5px}
.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.key{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:15px;padding:9px 16px;border-radius:6px;border:1px solid #000;cursor:pointer;color:#fff;background:#3b4048}
.key.reset{background:#a32020} .key.sil{background:#8a6a00} .key.ack{background:#1f5fa8}
.key[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #fff}
.rules{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.rules b{color:var(--fg)}
.log h3{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.log ol{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px}
.log li{padding:5px 8px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-variant-numeric:tabular-nums}
.log li:last-child{border-bottom:0}
.log .t{color:var(--muted)} .log .fire{color:var(--fire)} .log .pre{color:var(--warn)} .log .ok{color:var(--ok)} .log .empty{display:block;color:var(--muted)}

/* ---- editor ---- */
.btn{font:600 14px var(--f-body);padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dan{color:var(--fire);border-color:var(--fire)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.ed{margin-top:14px;background:var(--surface);border:2px solid var(--accent);border-radius:12px;overflow:hidden}
.ed-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ed-head h2{margin:0;font:700 22px var(--f-head);letter-spacing:.03em}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px}
.ed-msg{padding:8px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.ed-msg.ok{background:var(--ok-soft)} .ed-msg.warn{background:var(--warn-soft)} .ed-msg.err{background:var(--fire-soft)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{font:700 15px var(--f-head);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;background:none;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--fg);margin-bottom:-1px}
.ed-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
@media (max-width:640px){.item{grid-template-columns:1fr}}
.pic{width:150px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pic .frame{width:150px;height:100px;border-radius:8px;display:grid;place-items:center;background:repeating-conic-gradient(#e6e9ed 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
.pic img{max-width:140px;max-height:90px;object-fit:contain}
.fields{display:flex;flex-direction:column;gap:10px;min-width:0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ed input[type=text],.ed input[type=number],.ed select,.ed textarea{font:500 14px var(--f-body);padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.ed textarea{font-family:var(--f-mono);font-size:13px;min-height:62px;resize:vertical}
.pts{display:flex;flex-direction:column;gap:6px}
.pt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.pt-h{font-size:12px;color:var(--muted);font-weight:600}
.item-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-tools .sp{flex:1}
.cond{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.cond-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.cond-top input{width:70px!important}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.chk.sub{font-size:12.5px;border-style:dashed}
.chk:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.type-fire{border-left:5px solid var(--fire)} .type-pre{border-left:5px solid var(--warn)} .type-sup{border-left:5px solid #c9a227}
.hint{font-size:13px;color:var(--muted);margin:0}
.rule-item{grid-template-columns:1fr}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px}
.mk.sg{background:#3b4048} .mkb{border:0;border-radius:4px;color:#fff;font:700 12px var(--f-mono);padding:1px 6px;margin-left:4px;cursor:pointer} .mkb.on{background:var(--ok)} .mkb.sg{background:#3b4048}
.mx th.diag{position:sticky;left:0;z-index:4;min-width:340px;height:190px;background:linear-gradient(to top right,var(--surface-2) calc(50% - 1px),var(--fire) 50%,var(--surface-2) calc(50% + 1px))}
.mx th.diag .so{position:absolute;right:14px;top:30px} .mx th.diag .si{position:absolute;left:14px;bottom:30px}
.mx tr.zr td{background:var(--surface-2);height:30px}
.mx td.zt{font-weight:700;text-decoration:underline;text-align:left}
.mx td.cause{cursor:pointer;text-align:left;max-width:380px}
.mx td.cause .ct{display:block;font-size:13px;line-height:1.3}
.mx td.cause .rnm{display:block;font-size:11.5px;color:var(--muted)}
.mx td.cause:hover .ct{text-decoration:underline}
.mx tr.ced td{background:var(--surface-2);text-align:left}
.ced-in{display:flex;flex-direction:column;gap:8px;max-width:1000px;position:sticky;left:0}
.ctline{font-weight:600;font-size:14px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.hold{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)} .hold input{width:64px!important}
.sgs{z-index:2;background:#f1f3f6;border:calc(1.5*var(--u)) solid #c9d0d8;border-radius:calc(10*var(--u));padding:calc(8*var(--u)) calc(10*var(--u));display:flex;flex-direction:column;gap:calc(6*var(--u))}
.sgs-h{font:700 calc(15*var(--u)) var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:#3b4048;display:flex;align-items:center;gap:calc(6*var(--u))}
.sgs-l{display:grid;grid-template-columns:1fr;gap:calc(6*var(--u))}
.sg{display:flex;align-items:center;gap:calc(6*var(--u));background:#fff;border:calc(1.5*var(--u)) solid #d3d9e0;border-radius:calc(6*var(--u));padding:calc(5*var(--u)) calc(7*var(--u));min-width:0}
.sgn{flex:1;min-width:0;font-size:calc(14*var(--u));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#222}
.sgs-st{font:700 calc(12*var(--u)) var(--f-mono);color:#7a8590;white-space:nowrap}
.wedge{flex:none;width:calc(18*var(--u));height:calc(9*var(--u));background:#3b4048;clip-path:polygon(0 100%,100% 0,100% 100%)}
.sg.on{animation:cAmb 1.2s steps(1) infinite} .sg.on.fire{animation:cFire .8s steps(1) infinite} .sg.on .sgs-st{color:#9a2a1a}
.vsw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:5px;font:700 12.5px var(--f-mono);background:var(--accent);color:#fff}
.mk.on{background:var(--ok)} .mk.dl{background:var(--warn);gap:2px;display:inline-flex;align-items:center}
.mk.dl input{width:44px!important;padding:1px 3px!important;font:700 12px var(--f-mono)!important;border:0!important;border-radius:3px!important;text-align:center}
.mx-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.mx th,.mx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;text-align:center;background:var(--surface)}
.mx thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:700}
.mx thead tr:nth-child(2) th{top:31px}
.mx .gh.in{background:color-mix(in srgb,#1d4f91 16%,var(--surface-2))} .mx .gh.out{background:color-mix(in srgb,#1e6b3a 16%,var(--surface-2))}
.mx th.vt{height:150px;vertical-align:bottom;padding:6px 2px;min-width:34px}
.mx th.vt span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;font-size:12.5px}
.mx .stk{position:sticky;left:0;z-index:2;text-align:left;min-width:300px}
.mx thead .stk{z-index:4}
.mx .rn{display:flex;gap:4px;align-items:center}
.mx .rn input{font-size:13px!important;padding:5px 7px!important}
.mx .x{border:0;background:none;color:var(--fire);font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}
.mx td.c{cursor:pointer;min-width:34px;height:36px}
.mx td.c:hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.mx td.c.in.set{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.mx td.c.out.set{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.mx td.need{white-space:nowrap}
.mx td.need label{display:inline-flex;align-items:center;gap:2px;margin:1px 3px}
.mx td.need input{width:48px!important;padding:3px 4px!important}
.mx tr.r-fire .stk{box-shadow:inset 4px 0 0 var(--fire)} .mx tr.r-pre .stk{box-shadow:inset 4px 0 0 var(--warn)} .mx tr.r-sup .stk{box-shadow:inset 4px 0 0 #c9a227}
.tsel{font-weight:700!important;width:auto!important}
.tsel.t-fire{color:var(--fire)!important} .tsel.t-pre{color:var(--warn)!important} .tsel.t-sup{color:#a8860f!important}
.rhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rhead .rname{flex:1 1 260px;font-weight:700!important;font-size:15px!important}
.sent{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14.5px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.sent>input{width:64px!important}
.sent .checks{flex-basis:100%}
.kw{font:700 14px var(--f-head);letter-spacing:.08em;background:#1d4f91;color:#fff;padding:2px 9px;border-radius:4px}
.kw.then{background:#1e6b3a}
.dly{display:inline-flex;align-items:center;gap:3px;margin-left:4px;font-size:12px;color:var(--muted)}
.dly input{width:52px!important;padding:2px 4px!important;font-size:12.5px!important}
.voices{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:2s!important}}
</style>
</head>
<body>


<div class="wrap">
  <div class="topbar">
    <span style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a href="./" style="font-weight:600;color:var(--fg);text-decoration:none">← Back to Facility Checklist</a><span class="info" id="cfg-info">Loading setup…</span></span>
    <button class="btn pri" id="k-edit">Edit devices &amp; logic</button>
  </div>
  <div class="scroller"><div class="canvas" id="cv"></div></div>

  <div class="bar">
    <div class="pane">
      <div class="stage s0" id="stage"><span class="pill" id="pill">Normal</span><p id="stage-txt">System normal. No devices in alarm.</p></div>
      <div class="keys">
        <button class="key ack" id="k-ack" aria-pressed="false">Acknowledge</button>
        <button class="key sil" id="k-sil" aria-pressed="false">Signal silence</button>
        <button class="key reset" id="k-reset">Reset</button>
      </div>
      <div class="rules" id="rule-sum"></div>
    </div>
    <div class="pane log">
      <h3><span>Event log</span><span id="log-n">0 events</span></h3>
      <ol id="log"></ol>
    </div>
  </div>

  <section class="ed" id="ed" hidden>
    <div class="ed-head">
      <h2>Edit devices &amp; cause and effect</h2>
      <div class="ed-actions">
        <button class="btn pri" id="ed-save">Save for everyone</button>
        <button class="btn" id="ed-cancel">Cancel</button>
        <button class="btn dan" id="ed-default">Restore default setup</button>
      </div>
    </div>
    <div class="ed-msg" id="ed-msg" hidden></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="inputs" aria-selected="true">Inputs</button>
      <button class="tab" role="tab" data-tab="outputs" aria-selected="false">Outputs</button>
      <button class="tab" role="tab" data-tab="rules" aria-selected="false">Logic (cause &amp; effect)</button>
      <button class="tab" role="tab" data-tab="voices" aria-selected="false">Voice messages</button>
    </div>
    <div class="ed-body" id="ed-body"></div>
  </section>
  <input type="file" id="file-img" accept="image/png,image/webp,image/jpeg" hidden>
  <input type="file" id="file-aud" accept="audio/*" hidden>
</div>

/* ---------- logic ---------- */
function itemName(g,p){const n=g.name.replace(/ \(.*\)/,'');return p?(p.label?`${n} ${p.label.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase())}`:`${n} ${p.id}`):n}
function causeText(r){
  const C=cfg();
  const parts=(r.when||[]).map(c=>{
    const items=[];(c.groups||[]).forEach(k=>{const g=C.inputs.find(x=>x.key===k);if(g)items.push(itemName(g))});
    (c.points||[]).forEach(id=>{const f=findPoint(id);if(f)items.push(f.g.points.length>1?itemName(f.g,f.p):itemName(f.g))});
    if(!items.length)return '(choose devices)';
    const n=Math.max(1,+c.min||1);let s;
    if(n===1)s=items.join(' Or ');
    else if(items.length===n)s=items.join(' & ');
    else if(items.length===1)s=Array(n).fill(items[0]).join(' & ');
    else s=`Any ${n} of (${items.join(' Or ')})`;
    if(+c.hold)s+=` (for ${+c.hold} min)`;
    return (r.when.length>1&&n===1&&items.length>1)?`(${s})`:s;
  });
  const act={fire:'Double Activation',pre:'Single Activation',sup:'Supervisory'}[r.type];
  return `${parts.join(' & ')||'(no cause yet)'} (${act})`;
}
function cset(c){const C=cfg(),s=new Set(c.points||[]);(c.groups||[]).forEach(k=>{const g=C.inputs.find(x=>x.key===k);if(g)g.points.forEach(p=>s.add(p.id))});return s}
function findPoint(id){for(const g of cfg().inputs){const p=g.points.find(p=>p.id===id);if(p)return {g,p}}return null}
function compute(){
  const C=cfg();
  const cnt=k=>{const g=C.inputs.find(x=>x.key===k);return g?g.points.filter(p=>S.on.has(p.id)).length:0};
  const t=Date.now(), counting=[];
  const delayed=[],holding=[];
  const matched=C.rules.filter(r=>{
    const ok=r.when.length&&r.when.map((c,j)=>{const s=cset(c);const raw=s.size&&[...s].filter(id=>S.on.has(id)).length>=Math.max(1,+c.min||1);
      const hk=r.id+'#'+j,hold=Math.max(0,+c.hold||0)*60;
      if(!raw){delete S.hold[hk];return false}
      if(!hold)return true;
      if(!S.hold[hk])S.hold[hk]=t;const left=Math.ceil(hold-(t-S.hold[hk])/1000);
      if(left>0){holding.push({r,left});return false}return true}).every(Boolean);
    if(!ok){Object.keys(S.since).forEach(k=>{if(k.startsWith(r.id+'|'))delete S.since[k]});return false}
    return true;
  });
  const live=(r,o)=>{const d=Math.max(0,+(r.delays||{})[o]||0);if(!d)return true;const k=r.id+'|'+o;
    if(!S.since[k])S.since[k]=t;const left=Math.ceil(d-(t-S.since[k])/1000);
    if(left>0){counting.push({r,o,left,d});return false}delayed.push({r,o,d,k});return true};
  const sorted=[...matched].sort((a,b)=>TYPE[b.type].rank-TYPE[a.type].rank);
  const top=sorted[0]||null;
  const outState={},inState={},outMark={};
  matched.forEach(r=>{
    r.outputs.forEach(o=>{if(!live(r,o))return;const mk=(r.marks||{})[o]==='sup';if(!mk||!outMark[o])outMark[o]=mk?'sup':'on';if(!mk&&outMark[o]==='sup')outMark[o]='on';if(!outState[o]||TYPE[r.type].rank>TYPE[outState[o]].rank)outState[o]=r.type});
    r.when.forEach(c=>{const s=cset(c);C.inputs.forEach(g=>{const k=g.key;if(g.points.some(p=>s.has(p.id)&&S.on.has(p.id))&&(!inState[k]||TYPE[r.type].rank>TYPE[inState[k]].rank))inState[k]=r.type})});
  });
  const vr=sorted.find(r=>r.voice&&C.voices.some(v=>v.id===r.voice));
  const pts=C.inputs.flatMap(g=>g.points.filter(p=>S.on.has(p.id)).map(p=>({g,p})));
  return {matched,sorted,top,outState,inState,voice:vr?vr.voice:null,pts,counting,delayed,holding,outMark};
}
function now(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function log(cls,txt){S.log.unshift({t:now(),cls,txt});if(S.log.length>200)S.log.pop();renderLog()}
function renderLog(){

}
function toggle(id){

}
function outNames(r){const C=cfg();return r.outputs.length?r.outputs.map(k=>{const n=C.outputs.find(o=>o.key===k)?.name;const d=+(r.delays||{})[k]||0;return n?(d?`${n} (after ${d} s)`:n):''}).filter(Boolean).join(', '):'no outputs'}
function evaluate(quiet){
  const c=compute();

    c.matched.forEach(r=>{if(!S.matched.has(r.id))log(r.type==='fire'?'fire':'pre',`${TYPE[r.type].label.toUpperCase()} · ${r.name} · ON: ${outNames(r)}`)});

  }

  if(!quiet){
    c.counting.forEach(x=>{const k=x.r.id+'|'+x.o;if(!S.cd.has(k))log('pre',`COUNTDOWN · ${oname(x.o)} in ${x.d} s (${x.r.name})`)});
    c.delayed.forEach(x=>{if(!S.dOn.has(x.k))log('fire',`${oname(x.o).toUpperCase()} ON after ${x.d} s (${x.r.name})`)});
  }
  S.cd=new Set(c.counting.map(x=>x.r.id+'|'+x.o));S.dOn=new Set(c.delayed.map(x=>x.k));
  S.matched=ids;
  const rank=c.top?TYPE[c.top.type].rank:0;

function render(c){

/* ---------- sound ---------- */
let ctx,osc,gain,lfo,lg,am,amL,amG,ducking=false;
function audio(c){
  c=c||compute();
  const fire=c.top&&c.top.type==='fire';
  const mode=(ducking||(S.sil&&S.top>1))?null:fire?'sounder':(S.on.size&&!S.ack)?'buzzer':null;
  if(!mode){if(gain)gain.gain.setTargetAtTime(0,ctx.currentTime,.03);return}
  try{
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();osc=ctx.createOscillator();gain=ctx.createGain();lfo=ctx.createOscillator();lg=ctx.createGain();
      am=ctx.createGain();amL=ctx.createOscillator();amG=ctx.createGain();
      lfo.connect(lg);lg.connect(osc.frequency);osc.connect(am);am.connect(gain);gain.connect(ctx.destination);
      amL.type='square';amL.connect(amG);amG.connect(am.gain);gain.gain.value=0;osc.start();lfo.start();amL.start()}
    ctx.resume();
    if(mode==='sounder'){osc.type='square';osc.frequency.value=950;lfo.type='square';lfo.frequency.value=2;lg.gain.value=250;am.gain.value=1;amG.gain.value=0;gain.gain.setTargetAtTime(.06,ctx.currentTime,.03)}
    else{osc.type='sine';osc.frequency.value=2800;lg.gain.value=0;am.gain.value=.5;amG.gain.value=.5;amL.frequency.value=S.top?2:.8;gain.gain.setTargetAtTime(.035,ctx.currentTime,.03)}
  }catch(e){}
}
const VOICE={};let vCur=null,vTimer=null;
function vAudio(id){const v=cfg().voices.find(x=>x.id===id);if(!v)return null;const src=asset(v.asset);if(!src)return null;
  if(!VOICE[id]||VOICE[id].dataset.src!==v.asset){VOICE[id]=new Audio(src);VOICE[id].dataset.src=v.asset}return VOICE[id]}
function stopVoice(){Object.values(VOICE).forEach(a=>{a.pause();a.onended=null});clearTimeout(vTimer);ducking=false}
function voice(c){
  const want=S.sil?null:c.voice;
  if(want===vCur)return;
  stopVoice();vCur=want;
  if(want)playVoice(want);else audio();
}
function playVoice(id){
  if(vCur!==id)return;const a=vAudio(id);if(!a)return;
  a.currentTime=0;ducking=true;audio();
  a.onended=()=>{ducking=false;audio();vTimer=setTimeout(()=>playVoice(id),2500)};
  a.play().catch(()=>{ducking=false;audio()});
}

function normalise(c){

  c.voices=c.voices||d.voices;c.rules=c.rules||[];c.outputs=c.outputs||[];
  c.rules.forEach(r=>{r.delays=r.delays||{};r.marks=r.marks||{};r.zone=r.zone||'General';if(r.delay){r.outputs.forEach(o=>r.delays[o]=+r.delay);delete r.delay}r.when.forEach(w=>{w.groups=w.groups||[];w.points=w.points||[]})});return c;

  if(a==='addpt'){const g=draft.inputs[i];g.points.push({id:(g.points[0]?.id||'PT').replace(/\d+$/,'')+String(g.points.length+1).padStart(2,'0'),addr:''});changed(true)}
  if(a==='delpt'){const id=draft.inputs[i].points[j].id;draft.inputs[i].points.splice(j,1);draft.rules.forEach(r=>r.when.forEach(c=>c.points=(c.points||[]).filter(p=>p!==id)));changed(true)}
  if(a==='addcond'){draft.rules[i].when.push({groups:[],points:[],min:1});changed(true)}
  if(a==='delcond'){draft.rules[i].when.splice(j,1);changed(true)}
  if(a==='allout'){draft.rules[i].outputs=draft.outputs.map(o=>o.key);changed(true)}
  if(a==='noout'){draft.rules[i].outputs=[];draft.rules[i].delays={};draft.rules[i].marks={};changed(true)}
  if(a==='photo'){fileTarget={kind,i};$('#file-img').value='';$('#file-img').click()}
  if(a==='nophoto'){draft[kind][i].img='';changed(true)}
  if(a==='audio'){fileTarget={kind:'voices',i};$('#file-aud').value='';$('#file-aud').click()}
  if(a==='play'){const v=draft.voices[i];const s=asset(v.asset);if(s){const au=new Audio(s);au.play().catch(()=>{})}}
});
function readURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)})}
$('#file-img').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f||!fileTarget)return;
  try{
    const url=await readURL(f);const im=await new Promise((res,rej)=>{const x=new Image();x.onload=()=>res(x);x.onerror=rej;x.src=url});
    const s=Math.min(1,320/im.width,180/im.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const data=c.toDataURL('image/png');if(data.length>600000){msg('err','That photo is too detailed to store. Try a smaller PNG.');return}
    const id=uid('up:img');pending[id]=data;draft[fileTarget.kind][fileTarget.i].img=id;changed(true);msg('ok','Photo added. Press “Save for everyone” to keep it.');
  }catch(_){msg('err','Could not read that image. Use a PNG, JPG or WebP file.')}
});
$('#file-aud').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f||!fileTarget)return;
  if(f.size>1000000){msg('err','That audio file is over 1 MB. Use a shorter clip or an MP3.');return}
  try{const data=await readURL(f);const id=uid('up:aud');pending[id]=data;draft.voices[fileTarget.i].asset=id;changed(true);msg('ok','Voice file added. Press “Save for everyone” to keep it.')}
  catch(_){msg('err','Could not read that audio file.')}
});

renderLog();build();load();
</script>
